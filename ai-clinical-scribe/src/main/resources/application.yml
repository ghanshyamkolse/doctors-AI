spring:
  application:
    name: ai-clinical-scribe
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_clinical_scribe}
    username: ${DB_USERNAME:scribe}
    password: ${DB_PASSWORD:scribe}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  ai:
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:mock-soap-extractor-v1}
    whisper:
      provider: ${WHISPER_PROVIDER:mock}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    root: INFO
    com.scribe: ${LOG_LEVEL:INFO}
