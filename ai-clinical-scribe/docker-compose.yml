services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-clinical-scribe-db
    environment:
      POSTGRES_DB: ai_clinical_scribe
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
    ports:
      - "5432:5432"
    volumes:
      - scribe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d ai_clinical_scribe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scribe-pgdata:
